name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and app versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag version $tag_version does not match app version $app_version" >&2
            exit 1
          fi

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/CIDeck.app "CIDeck-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "CIDeck-${GITHUB_REF_NAME}.zip" > "CIDeck-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "CIDeck-${GITHUB_REF_NAME}.zip" \
            "CIDeck-${GITHUB_REF_NAME}.zip.sha256" \
            --generate-notes \
            --title "CIDeck ${GITHUB_REF_NAME}"
